
name: Test Lunaris Node.js Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Test API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1
